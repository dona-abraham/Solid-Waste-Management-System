{% extends 'regheader.html' %}
{% block content %}
<html>
    <head>
        <title>Municipality Registration</title>
        <style>
             .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: block;
        }

        </style>
    </head>
    <body align="center">
        <!-- <h1>Registration Form</h1> -->
        <form method="post" novalidate>
            {% csrf_token %}
            <table align="center">
            <tr>
                <td><label>Name:</label></td>
                <td class="contact-one__form-input-box">{{form.muncipality_name}}
                    <span class="error-message" id="name-error"></span>   
                </td>
            </tr>
            <tr>
                <td><label>Address:</label></td>
                <td class="contact-one__form-input-box">{{form.address}}
                    <span class="error-message" id="address-error"></span>   
                </td>
            </tr>
            <tr>
                <td><label>City:</label></td>
                <td class="contact-one__form-input-box">{{form.city}}
                    <span class="error-message" id="city-error"></span>   
                </td>
            </tr>
            <tr>
                <td><label>Thaluk:</label></td>
                <td class="contact-one__form-input-box">{{form.thaluk}}
                    <span class="error-message" id="thaluk-error"></span>   
                </td>
            </tr>
            <tr>
                <td><label>Contact:</label></td>
                <td class="contact-one__form-input-box">{{form.contact_no}}
                    <span class="error-message" id="contact_no-error"></span>   
                </td>
            </tr>
            <tr>
                <td><label>Email:</label></td>
                <td class="contact-one__form-input-box">{{loginform.email}}
                    <span class="error-message" id="email-error"></span>   
                </td>
            </tr>
            <tr>
                <td><label>Password:</label></td>
                <td class="contact-one__form-input-box">{{loginform.password}}
                    <span class="error-message" id="password-error"></span>   
                </td>
            </tr>
        </table>
            <button class="thm-btn contact-one__btn" type="submit">Submit</button>
        </form>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const fields = ['muncipality_name','address','city','thaluk','contact_no','email', 'password'];
        
                // Required field validation
                fields.forEach(field => {
                    const input = document.querySelector(`input[name="${field}"]`);
                    const error = document.getElementById(`${field}-error`);
                    if (input) {
                        input.addEventListener('input', () => {
                            if (input.value.trim() === '') {
                                error.textContent = 'This field is required.';
                            } else {
                                error.textContent = '';
                            }
                        });
                    }
                });
        
                // ✅ Name validation (letters and spaces only)
                const nameInput = document.querySelector('input[name="muncipality_name"]');
                const nameError = document.getElementById('name-error');
                if (nameInput) {
                    nameInput.addEventListener('input', function () {
                        const value = nameInput.value.trim();
                        const regex = /^[A-Za-z ]+$/;
        
                        if (value === '') {
                            nameError.textContent = 'This field is required.';
                        } else if (!regex.test(value)) {
                            nameError.textContent = 'Only letters and spaces are allowed.';
                        } else {
                            nameError.textContent = '';
                        }
                    });
                }
        
                // ✅ Contact validation (10 digits)
                const contactInput = document.querySelector('input[name="contact_no"]');
                const contactError = document.getElementById('contact_no-error');
                if (contactInput) {
                    contactInput.addEventListener('input', function () {
                        const value = contactInput.value.trim();
                        const regex = /^\d{10}$/;
        
                        if (value === '') {
                            contactError.textContent = 'This field is required.';
                        } else if (!regex.test(value)) {
                            contactError.textContent = 'Contact must be exactly 10 digits.';
                        } else {
                            contactError.textContent = '';
                        }
                    });
                }
        
                // ✅ Email validation (valid email format)
                const emailInput = document.querySelector('input[name="email"]');
                const emailError = document.getElementById('email-error');
                if (emailInput) {
                    emailInput.addEventListener('input', function () {
                        const value = emailInput.value.trim();
                        const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        
                        if (value === '') {
                            emailError.textContent = 'This field is required.';
                        } else if (!regex.test(value)) {
                            emailError.textContent = 'Please enter a valid email address.';
                        } else {
                            emailError.textContent = '';
                        }
                    });
                }
        
                // ✅ Password validation (strength check)
                const passwordInput = document.querySelector('input[name="password"]');
                const passwordError = document.getElementById('password-error');
                if (passwordInput) {
                    passwordInput.addEventListener('input', function () {
                        const value = passwordInput.value;
                        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
        
                        if (value.trim() === '') {
                            passwordError.textContent = 'This field is required.';
                        } else if (!regex.test(value)) {
                            passwordError.textContent = 'Password must contain uppercase, lowercase, digit, special character, and be at least 8 characters.';
                        } else {
                            passwordError.textContent = '';
                        }
                    });
                }
            });
        </script>
        
    </body>
</html>
{% endblock %}
