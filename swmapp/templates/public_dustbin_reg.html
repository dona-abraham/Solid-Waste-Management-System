{% extends 'muncipal_header.html' %}
{% block content %}
<html>
    <head>
        <title>Public Dustbin Registration</title>
        <style>
            #mapModal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                text-align: center;
                padding: 20px;
            }
            #map {
                width: 80%;
                height: 500px;
                margin: auto;
                background: #fff;
            }
            button {
                margin-top: 10px;
                padding: 10px 20px;
                background-color: #007bff;
                color: white;
                border: none;
                cursor: pointer;
            }
            button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body align="center">
        <form method="post">
            {% csrf_token %}
            <table align="center">
                <tr>
                    <td><label>Dustbin ID:</label></td>
                    <td class="contact-one__form-input-box">{{ public_dustbinform.dustbin_id }}</td>
                </tr>
            </table>
            
            <!-- Hidden fields for latitude and longitude -->
            <input type="hidden" name="latitude" id="latitude">
            <input type="hidden" name="longitude" id="longitude">
            
            <td> 
                <a href="#" onclick="openMapModal()">Submit</a>
            </td>
        </form>

        <!-- Modal for Map -->
        <div id="mapModal">
            <div id="map"></div>
            <button onclick="saveLocation()">Confirm Location</button>
            <button onclick="closeMapModal()">Close</button>
        </div>
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    </body>
</html>

<script type="text/javascript">
    var selectedLocation = null;

    function openMapModal() {
        // Show the map modal
        document.getElementById('mapModal').style.display = 'block';

        // Initialize the map (if not already initialized)
        if (typeof L !== 'undefined') {
            initMap();
        }
    }

    function closeMapModal() {
        document.getElementById('mapModal').style.display = 'none';
    }

    function initMap() {
        var defaultLocation = [28.6139, 77.2090]; // Coordinates for New Delhi, India

        // Create the map
        var map = L.map('map').setView(defaultLocation, 5); // Adjusted zoom level

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Add a marker and listen for click events
        var marker = L.marker(defaultLocation).addTo(map);

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            selectedLocation = e.latlng;
        });
    }

    function saveLocation() {
        if (!selectedLocation) {
            alert("Please select a location on the map.");
            return;
        }

        // Set latitude and longitude values in the hidden fields
        document.getElementById('latitude').value = selectedLocation.lat;
        document.getElementById('longitude').value = selectedLocation.lng;

        // Submit the form
        document.querySelector('form').submit();
    }
</script>
{% endblock %}
